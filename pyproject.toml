[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "sessions-manager"
version = "0.1.0"
description = "A private local command center for AI CLI sessions"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["typer>=0.27.3,<0.28", "textual>=6,<7", "rich>=14,<15", "tomli-w>=1.2,<2"]

[project.scripts]
sessions = "sessions_manager.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/sessions_manager"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
